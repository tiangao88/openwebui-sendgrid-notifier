[project]
name = "openwebui-sendgrid-notifier"
version = "1.3.1"
description = "An OpenWebUI tool that sends Markdown email notifications, rendered Mermaid diagrams, and Open Terminal attachments to the current user's account email."
requires-python = ">=3.11"
dependencies = [
    "Markdown>=3.10,<4",
    "pydantic>=2.0",
    "pymdown-extensions>=10.21,<11",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
