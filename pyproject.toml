[project]
name = "openwebui-sendgrid-notifier"
version = "1.4.0"
description = "An OpenWebUI tool and message action that send Markdown email notifications with rendered Mermaid diagrams to the current user's account email."
requires-python = ">=3.11"
dependencies = [
    "Markdown>=3.10,<4",
    "pydantic>=2.0",
    "pymdown-extensions>=10.21,<11",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
